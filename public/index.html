<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garena Learning Hub</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #E41E26;
      --red-dark: #b5161c;
      --red-light: #fdeced;
      --yellow: #FFBA00;
      --yellow-light: #fff8e1;
      --dark: #0d1117;
      --dark2: #161b22;
      --dark3: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --text-bright: #f0f6fc;
      --bg: #0d1117;
      --sidebar-w: 220px;
      --radius: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--dark2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .gap-4 { gap: 4px; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .gap-16 { gap: 16px; }
    .align-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .w-full { width: 100%; }
    .text-dim { color: var(--text-dim); font-size: 13px; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 11px; }
    .bold { font-weight: 600; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-24 { margin-bottom: 24px; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius); border: none;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s;
      text-decoration: none; white-space: nowrap;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--red-dark); }
    .btn-secondary { background: var(--dark3); color: var(--text-bright); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }
    .btn-yellow { background: var(--yellow); color: var(--dark); }
    .btn-yellow:hover:not(:disabled) { background: #e5a800; }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { color: var(--text-bright); border-color: var(--text-dim); }
    .btn-danger { background: transparent; color: #f85149; border: 1px solid #f85149; }
    .btn-danger:hover:not(:disabled) { background: #f8514920; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 8px; border-radius: 6px; }

    /* ── Form elements ── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; color: var(--text-dim); font-weight: 500; }
    input[type=text], input[type=email], input[type=number], input[type=password],
    textarea, select {
      background: var(--dark2); border: 1px solid var(--border); color: var(--text-bright);
      border-radius: var(--radius); padding: 9px 12px; font-size: 14px; width: 100%;
      transition: border-color .15s; outline: none; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--red); }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: var(--dark2); }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
      border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px;
      transition: all .15s; user-select: none; color: var(--text-dim);
    }
    .checkbox-pill input { display: none; }
    .checkbox-pill.checked { border-color: var(--red); background: var(--red-light); color: var(--red); }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: .3px;
    }
    .badge-red { background: #3d0009; color: #ff7b72; border: 1px solid #58181f; }
    .badge-yellow { background: #3d2800; color: var(--yellow); border: 1px solid #5a3c00; }
    .badge-green { background: #0d2a1a; color: #3fb950; border: 1px solid #1a4429; }
    .badge-blue { background: #0c1e40; color: #58a6ff; border: 1px solid #1c3a6e; }
    .badge-purple { background: #2a1b3d; color: #bc8cff; border: 1px solid #4a2f7e; }
    .badge-gray { background: var(--dark3); color: var(--text-dim); border: 1px solid var(--border); }

    /* ── Card ── */
    .card {
      background: var(--dark2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; transition: border-color .15s;
    }

    /* ── Alert / Toast ── */
    #toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; max-width: 360px;
    }
    .toast {
      padding: 12px 16px; border-radius: var(--radius); font-size: 14px;
      box-shadow: var(--shadow); animation: slideIn .2s ease; display: flex; align-items: center; gap: 10px;
    }
    .toast-success { background: #1a4429; color: #3fb950; border: 1px solid #238636; }
    .toast-error { background: #3d0009; color: #ff7b72; border: 1px solid #6e2230; }
    .toast-info { background: #0c1e40; color: #58a6ff; border: 1px solid #1c3a6e; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--dark2);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow-y: auto; z-index: 100; transition: left .25s;
    }
    .sidebar-logo {
      padding: 20px 16px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 32px; height: 32px; background: var(--red); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #fff; flex-shrink: 0;
    }
    .logo-text { font-weight: 700; font-size: 14px; color: var(--text-bright); line-height: 1.2; }
    .logo-sub { font-size: 10px; color: var(--text-dim); }
    .nav-section { padding: 12px 8px 4px; }
    .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-dim); padding: 0 8px; margin-bottom: 4px; text-transform: uppercase; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-dim);
      transition: all .15s; user-select: none; margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--dark3); color: var(--text-bright); }
    .nav-item.active { background: var(--red-light); color: var(--red); font-weight: 600; }
    .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { margin-top: auto; padding: 12px 8px; border-top: 1px solid var(--border); }
    .user-chip {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 6px; cursor: pointer;
    }
    .user-chip:hover { background: var(--dark3); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--red);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; color: var(--text-bright); font-weight: 600; }
    .user-email { font-size: 11px; color: var(--text-dim); }

    /* ── Main content ── */
    #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
    #topbar {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--dark2); position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text-bright); }
    #content { padding: 24px; flex: 1; }

    /* ── Login page ── */
    #login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); padding: 24px;
    }
    .login-box {
      background: var(--dark2); border: 1px solid var(--border); border-radius: 12px;
      padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow);
    }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .logo-icon { width: 56px; height: 56px; font-size: 26px; margin: 0 auto 12px; }
    .login-logo h1 { font-size: 22px; color: var(--text-bright); font-weight: 700; }
    .login-logo p { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-dim); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Course catalog ── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .filter-bar input[type=text] { min-width: 200px; flex: 1; }
    .filter-bar select { min-width: 130px; }
    .courses-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }
    .course-card {
      background: var(--dark2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; cursor: pointer; transition: all .15s; display: flex; flex-direction: column; gap: 10px;
    }
    .course-card:hover { border-color: var(--red); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    .course-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .course-title { font-size: 15px; font-weight: 600; color: var(--text-bright); line-height: 1.3; }
    .course-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
    .xp-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--yellow); font-size: 12px; font-weight: 600; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1000;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 24px; overflow-y: auto;
    }
    .modal {
      background: var(--dark2); border: 1px solid var(--border); border-radius: 12px;
      width: 100%; max-width: 700px; box-shadow: var(--shadow);
      animation: fadeUp .2s ease; margin: auto;
    }
    @keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--text-bright); }
    .modal-body { padding: 24px; }
    .close-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 20px; padding: 2px 6px; border-radius: 4px; line-height: 1; }
    .close-btn:hover { color: var(--text-bright); background: var(--dark3); }

    /* ── Info grid ── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-item { display: flex; flex-direction: column; gap: 3px; }
    .info-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
    .info-value { font-size: 14px; color: var(--text-bright); font-weight: 500; }
    .section-title { font-size: 15px; font-weight: 700; color: var(--text-bright); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    /* ── Sessions ── */
    .session-item {
      background: var(--dark3); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .session-date-label { font-size: 14px; color: var(--text-bright); font-weight: 600; }
    .session-info { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

    /* ── Calendar / Sessions list ── */
    .month-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .month-label { font-size: 18px; font-weight: 700; color: var(--text-bright); min-width: 160px; text-align: center; }
    .date-group { margin-bottom: 20px; }
    .date-heading { font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

    /* ── Rating stars ── */
    .stars { display: flex; gap: 4px; }
    .star { font-size: 20px; cursor: pointer; color: var(--border); transition: color .1s; }
    .star.filled { color: var(--yellow); }

    /* ── Testimonials ── */
    .testimonial-item {
      background: var(--dark3); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px;
    }
    .testimonial-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

    /* ── Profile / My page ── */
    .profile-header {
      display: flex; align-items: center; gap: 20px; margin-bottom: 28px;
      padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    .avatar-lg {
      width: 72px; height: 72px; border-radius: 50%; background: var(--red);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 28px; color: #fff; flex-shrink: 0;
    }

    /* ── Onboarding ── */
    .onboarding-wrap {
      max-width: 560px; margin: 0 auto;
      background: var(--dark2); border: 1px solid var(--yellow); border-radius: 12px; padding: 32px;
    }
    .onboarding-title { font-size: 20px; font-weight: 700; color: var(--yellow); margin-bottom: 8px; }
    .onboarding-subtitle { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; }

    /* ── Accordion ── */
    .accordion-item { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
    .accordion-header {
      padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between;
      align-items: center; background: var(--dark2); user-select: none; transition: background .15s;
    }
    .accordion-header:hover { background: var(--dark3); }
    .accordion-title { font-size: 14px; font-weight: 600; color: var(--text-bright); }
    .accordion-arrow { color: var(--text-dim); transition: transform .2s; font-size: 12px; }
    .accordion-arrow.open { transform: rotate(180deg); }
    .accordion-body { padding: 16px; border-top: 1px solid var(--border); background: var(--dark3); display: none; }
    .accordion-body.open { display: block; }
    .policy-text { font-size: 14px; color: var(--text); line-height: 1.7; white-space: pre-wrap; }

    /* ── LD Request ── */
    .ld-request-item {
      background: var(--dark2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px;
    }
    .ld-request-desc { font-size: 14px; color: var(--text-bright); margin-bottom: 10px; }
    .ld-request-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    /* ── Loading ── */
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--red);
      border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-container { display: flex; justify-content: center; align-items: center; padding: 60px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 8px; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
    .tab { padding: 10px 16px; cursor: pointer; font-size: 14px; color: var(--text-dim); border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap; }
    .tab:hover { color: var(--text-bright); }
    .tab.active { color: var(--red); border-bottom-color: var(--red); font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Enrollment list ── */
    .enrollment-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .enrollment-row:last-child { border-bottom: none; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed; left: -100%; height: 100vh;
      }
      #sidebar.open { left: 0; box-shadow: var(--shadow); }
      .info-grid { grid-template-columns: 1fr; }
      .courses-grid { grid-template-columns: 1fr; }
      #content { padding: 16px; }
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal { border-radius: 12px 12px 0 0; max-height: 90vh; overflow-y: auto; margin: 0; }
      .topbar-title { font-size: 16px; }
      #ld-grid { grid-template-columns: 1fr !important; }
    }
    #mobile-menu-btn { display: none; }
    @media (max-width: 768px) {
      #mobile-menu-btn { display: flex; }
    }
  </style>
</head>
<body>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ════════════════════════════════════════
     LOGIN PAGE
════════════════════════════════════════ -->
<div id="login-page" class="hidden">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon" style="width:56px;height:56px;font-size:26px;margin:0 auto 12px;">G</div>
      <h1>Garena Learning Hub</h1>
      <p>Nền tảng học tập nội bộ Garena</p>
    </div>

    <a href="/auth/google" class="btn btn-secondary w-full" style="justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">

        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>

        <label for="dev-email">Email</label>
        <input type="email" id="dev-email" placeholder="your@garena.vn" />

        Đăng nhập Dev
      </button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     MAIN APP SHELL
════════════════════════════════════════ -->
<div id="app" class="hidden">
  <!-- Mobile sidebar overlay -->
  <div id="sidebar-overlay" class="hidden"
    style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;"
    onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">G</div>
      <div>
        <div class="logo-text">Learning Hub</div>
        <div class="logo-sub">Garena Vietnam</div>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Main</div>
      <div class="nav-item active" data-page="catalog" onclick="navigate('catalog')">
        <span class="nav-icon">📚</span> Course Catalog
      </div>
      <div class="nav-item" data-page="sessions" onclick="navigate('sessions')">
        <span class="nav-icon">📅</span> Sessions
      </div>
      <div class="nav-item" data-page="profile" onclick="navigate('profile')">
        <span class="nav-icon">👤</span> My Profile
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Resources</div>
      <div class="nav-item" data-page="policies" onclick="navigate('policies')">
        <span class="nav-icon">📋</span> Policies
      </div>
      <div class="nav-item" data-page="ld-request" onclick="navigate('ld-request')">
        <span class="nav-icon">✉️</span> L&amp;D Request
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip" onclick="navigate('profile')">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <div class="user-name truncate" id="sidebar-name">Loading...</div>
          <div class="user-email truncate" id="sidebar-email"></div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm w-full mt-8" style="justify-content:center;" onclick="doLogout()">
        Sign out
      </button>
    </div>
  </nav>

  <!-- Main content area -->
  <div id="main">
    <div id="topbar">
      <div class="flex align-center gap-12">
        <button class="btn btn-icon btn-secondary" id="mobile-menu-btn" onclick="openSidebar()">☰</button>
        <div class="topbar-title" id="page-title">Course Catalog</div>
      </div>
      <div style="font-size:13px;color:var(--text-dim)" id="topbar-user"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ════════════════════════════════════════
     COURSE DETAIL MODAL
════════════════════════════════════════ -->
<div id="course-modal" class="modal-overlay hidden" onclick="handleOverlayClick(event,'course-modal')">
  <div class="modal">
    <div class="modal-header">
      <div style="flex:1;min-width:0;">
        <div class="modal-title" id="modal-course-title">Loading…</div>
        <div class="flex gap-8 mt-8" id="modal-course-badges"></div>
      </div>
      <button class="close-btn" onclick="closeModal('course-modal')">✕</button>
    </div>
    <div class="modal-body" id="modal-course-body">
      <div class="loading-container"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const State = {
  user: null,
  currentPage: 'catalog',
  currentMonth: new Date().toISOString().slice(0, 7),
  selectedStar: 0,
  catalogFilters: { search: '', format: '', type: '' },
};

// ═══════════════════════════════════════════════════════════
// API LAYER
// ═══════════════════════════════════════════════════════════
const API = {
  token: () => localStorage.getItem('glh_token'),

  async req(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    const tok = API.token();
    if (tok) opts.headers['Authorization'] = `Bearer ${tok}`;
    if (body !== undefined) opts.body = JSON.stringify(body);
    let res;
    try { res = await fetch(path, opts); }
    catch (e) { throw new Error('Network error: ' + e.message); }
    if (res.status === 401) {
      localStorage.removeItem('glh_token');
      showLogin();
      throw new Error('Session expired. Please log in again.');
    }
    if (res.status === 204) return null;
    if (!res.ok) {
      let msg = res.statusText;
      try { const j = await res.json(); msg = j.message || j.error || msg; } catch {}
      throw new Error(msg);
    }
    return res.json();
  },

  get:    (p)    => API.req('GET', p),
  post:   (p, b) => API.req('POST', p, b),
  put:    (p, b) => API.req('PUT', p, b),
  delete: (p)    => API.req('DELETE', p),
};

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  try {
    return new Date(d).toLocaleDateString('vi-VN', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
  } catch { return String(d); }
}

function fmtTime(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' }); } catch { return ''; }
}

function starsHtml(n) {
  return [1,2,3,4,5].map(i => `<span class="star ${i <= n ? 'filled' : ''}">★</span>`).join('');
}

function formatBadge(f) {
  const m = { online:'badge-blue', offline:'badge-green', hybrid:'badge-purple', blended:'badge-yellow' };
  return f ? `<span class="badge ${m[f] || 'badge-gray'}">${esc(f)}</span>` : '';
}

function rankBadge(r) {
  return r ? `<span class="badge badge-purple">${esc(r)}</span>` : '';
}

function spinner() {
  return '<div class="loading-container"><div class="spinner"></div></div>';
}

function emptyState(icon, title, sub) {
  return `<div class="empty-state"><div class="icon">${icon}</div><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div>`;
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${icons[type] || 'ℹ'}</span><span>${esc(msg)}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function showLogin() {
  document.getElementById('login-page').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

function showApp() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function updateUserUI() {
  const u = State.user;
  if (!u) return;
  const name = u.name || u.email || '';
  document.getElementById('sidebar-avatar').textContent = name.charAt(0).toUpperCase() || '?';
  document.getElementById('sidebar-name').textContent = name;
  document.getElementById('sidebar-email').textContent = u.email || '';
  document.getElementById('topbar-user').textContent = name;
}

async function init() {
  if (!API.token()) { showLogin(); return; }
  try {
    State.user = await API.get('/me');
    updateUserUI();
    showApp();
    navigate('catalog');
  } catch { showLogin(); }
}

document.getElementById('dev-login-btn').addEventListener('click', async () => {
  const email = document.getElementById('dev-email').value.trim();
  if (!email) { toast('Vui lòng nhập email', 'error'); return; }
  const btn = document.getElementById('dev-login-btn');
  btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
  try {
    const data = await API.post('/auth/dev-login', { email });
    localStorage.setItem('glh_token', data.token);
    State.user = data.user;
    updateUserUI();
    showApp();
    navigate('catalog');
    toast('Đăng nhập thành công!', 'success');
  } catch (e) {
    toast(e.message || 'Đăng nhập thất bại', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Đăng nhập Dev';
  }
});

async function doLogout() {
  try { await API.post('/auth/logout'); } catch {}
  localStorage.removeItem('glh_token');
  State.user = null;
  showLogin();
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
const PAGE_TITLES = {
  catalog: 'Course Catalog',
  sessions: 'Sessions Calendar',
  profile: 'My Profile',
  policies: 'Policies',
  'ld-request': 'L&D Request',
};

function navigate(page) {
  State.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (nav) nav.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  closeSidebar();
  const c = document.getElementById('content');
  ({ catalog: renderCatalog, sessions: renderSessions, profile: renderProfile,
     policies: renderPolicies, 'ld-request': renderLDRequest })[page]?.(c);
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.remove('hidden');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.add('hidden');
}

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
function openModal(id) {
  document.getElementById(id).classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
  document.body.style.overflow = '';
}
function handleOverlayClick(e, id) {
  if (e.target === e.currentTarget) closeModal(id);
}

// ═══════════════════════════════════════════════════════════
// PAGE: COURSE CATALOG
// ═══════════════════════════════════════════════════════════
function renderCatalog(container) {
  const f = State.catalogFilters;
  container.innerHTML = `
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 Tìm kiếm khóa học…" value="${esc(f.search)}" />
      <select id="filter-format">
        <option value="">Tất cả format</option>
        <option value="online" ${f.format==='online'?'selected':''}>Online</option>
        <option value="offline" ${f.format==='offline'?'selected':''}>Offline</option>
        <option value="hybrid" ${f.format==='hybrid'?'selected':''}>Hybrid</option>
        <option value="blended" ${f.format==='blended'?'selected':''}>Blended</option>
      </select>
      <select id="filter-type">
        <option value="">Tất cả loại</option>
        <option value="technical" ${f.type==='technical'?'selected':''}>Technical</option>
        <option value="soft-skill" ${f.type==='soft-skill'?'selected':''}>Soft Skill</option>
        <option value="leadership" ${f.type==='leadership'?'selected':''}>Leadership</option>
        <option value="compliance" ${f.type==='compliance'?'selected':''}>Compliance</option>
      </select>
      <button class="btn btn-primary" onclick="doSearch()">Tìm kiếm</button>
      <button class="btn btn-ghost" onclick="clearSearch()">Xóa</button>
    </div>
    <div id="courses-container">${spinner()}</div>
  `;
  document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  loadCourses();
}

function doSearch() {
  State.catalogFilters.search = document.getElementById('search-input')?.value.trim() || '';
  State.catalogFilters.format = document.getElementById('filter-format')?.value || '';
  State.catalogFilters.type   = document.getElementById('filter-type')?.value || '';
  loadCourses();
}

function clearSearch() {
  State.catalogFilters = { search: '', format: '', type: '' };
  renderCatalog(document.getElementById('content'));
}

async function loadCourses() {
  const cont = document.getElementById('courses-container');
  if (!cont) return;
  cont.innerHTML = spinner();
  const f = State.catalogFilters;
  const p = new URLSearchParams();
  if (f.search) p.set('search', f.search);
  if (f.format) p.set('format', f.format);
  if (f.type)   p.set('type', f.type);
  try {
    const courses = await API.get('/courses?' + p.toString());
    if (!courses?.length) { cont.innerHTML = emptyState('📚', 'Không tìm thấy khóa học', 'Thử thay đổi bộ lọc'); return; }
    cont.innerHTML = `<div class="courses-grid">${courses.map(courseCardHtml).join('')}</div>`;
  } catch (e) {
    cont.innerHTML = emptyState('⚠️', 'Lỗi tải dữ liệu', e.message);
  }
}

function courseCardHtml(c) {
  return `
    <div class="course-card" onclick="openCourseDetail('${esc(c.id)}')">
      <div class="course-card-header">
        <div class="course-title">${esc(c.title)}</div>
        ${c.is_enrolled ? '<span class="badge badge-green">✓ Enrolled</span>' : ''}
      </div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        ${formatBadge(c.format)}
        ${c.fit_tag ? `<span class="badge badge-yellow">${esc(c.fit_tag)}</span>` : ''}
        ${c.rank ? rankBadge(c.rank) : ''}
        ${c.type ? `<span class="badge badge-gray">${esc(c.type)}</span>` : ''}
      </div>
      ${c.trainer ? `<div class="text-dim text-sm">👨‍🏫 ${esc(c.trainer)}</div>` : ''}
      <div class="course-footer">
        <div class="text-dim text-sm">⏱ ${c.duration_hours ? c.duration_hours + 'h' : '—'}</div>
        ${c.xp_reward ? `<div class="xp-tag">⭐ ${c.xp_reward} XP</div>` : ''}
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// COURSE DETAIL MODAL
// ═══════════════════════════════════════════════════════════
async function openCourseDetail(id) {
  document.getElementById('modal-course-title').textContent = 'Đang tải…';
  document.getElementById('modal-course-badges').innerHTML = '';
  document.getElementById('modal-course-body').innerHTML = spinner();
  openModal('course-modal');
  try {
    const [course, sessions, testimonials] = await Promise.all([
      API.get(`/courses/${id}`),
      API.get(`/sessions?course_id=${id}`).catch(() => []),
      API.get(`/courses/${id}/testimonials`).catch(() => []),
    ]);
    renderCourseModal(course, sessions || [], testimonials || []);
  } catch (e) {
    document.getElementById('modal-course-body').innerHTML = emptyState('⚠️', e.message);
  }
}

function renderCourseModal(course, sessions, testimonials) {
  document.getElementById('modal-course-title').textContent = course.title;
  document.getElementById('modal-course-badges').innerHTML = `
    ${formatBadge(course.format)}
    ${course.fit_tag ? `<span class="badge badge-yellow">${esc(course.fit_tag)}</span>` : ''}
    ${course.is_enrolled ? '<span class="badge badge-green">✓ Enrolled</span>' : ''}
    ${course.is_completed ? '<span class="badge badge-blue">✓ Completed</span>' : ''}
  `;

  State.selectedStar = 0;
  const courseId = course.id;

  document.getElementById('modal-course-body').innerHTML = `
    <!-- Info -->
    <div class="info-grid mb-16">
      <div class="info-item"><div class="info-label">Duration</div><div class="info-value">⏱ ${course.duration_hours ? course.duration_hours + ' hours' : '—'}</div></div>
      <div class="info-item"><div class="info-label">Trainer</div><div class="info-value">👨‍🏫 ${esc(course.trainer || '—')}</div></div>
      <div class="info-item"><div class="info-label">XP Reward</div><div class="info-value" style="color:var(--yellow)">⭐ ${course.xp_reward || 0} XP</div></div>
      <div class="info-item"><div class="info-label">Target Rank</div><div class="info-value">${rankBadge(course.target_rank) || '—'}</div></div>
      <div class="info-item"><div class="info-label">Type</div><div class="info-value">${esc(course.type || '—')}</div></div>
      <div class="info-item"><div class="info-label">Target Role</div><div class="info-value">${esc(course.target_role || '—')}</div></div>
    </div>

    ${course.description ? `
      <div class="mb-16">
        <div class="section-title">Mô tả</div>
        <div style="font-size:14px;line-height:1.7;color:var(--text)">${esc(course.description)}</div>
      </div>` : ''}

    ${course.skills?.length ? `
      <div class="mb-16">
        <div class="section-title">Kỹ năng học được</div>
        <div class="flex gap-8" style="flex-wrap:wrap">
          ${course.skills.map(s => `<span class="badge badge-blue">${esc(s)}</span>`).join('')}
        </div>
      </div>` : ''}

    <!-- Action -->
    <div class="flex gap-8 mb-16">
      ${!course.is_completed
        ? `<button class="btn btn-yellow" onclick="completeCourse('${esc(courseId)}',this)">✓ Mark as Completed</button>`
        : '<span class="badge badge-blue" style="padding:8px 16px;font-size:13px;">✓ Đã hoàn thành</span>'}
    </div>

    <!-- Sessions -->
    <div class="mb-16">
      <div class="section-title">Buổi học sắp tới (${sessions.length})</div>
      ${sessions.length === 0
        ? '<div class="text-dim text-sm">Chưa có buổi học nào được lên lịch</div>'
        : `<div class="flex flex-col gap-8">${sessions.map(s => sessionRowHtml(s)).join('')}</div>`}
    </div>

    <!-- Testimonials -->
    <div>
      <div class="section-title">Đánh giá &amp; Nhận xét</div>
      <div id="testimonials-list" class="flex flex-col gap-8 mb-16">
        ${testimonials.length === 0
          ? '<div class="text-dim text-sm">Chưa có đánh giá nào</div>'
          : testimonials.map(testimonialHtml).join('')}
      </div>
      <!-- Write testimonial -->
      <div class="card">
        <div class="bold mb-8" style="color:var(--text-bright)">Viết đánh giá</div>
        <div class="form-group mb-8">
          <label>Số sao</label>
          <div class="stars" id="star-selector">
            ${[1,2,3,4,5].map(i => `<span class="star" onclick="selectStar(${i})" style="cursor:pointer">★</span>`).join('')}
          </div>
        </div>
        <div class="form-group mb-8">
          <label>Nội dung</label>
          <textarea id="testimonial-content" placeholder="Chia sẻ trải nghiệm của bạn…"></textarea>
        </div>
        <button class="btn btn-primary btn-sm" onclick="submitTestimonial('${esc(courseId)}')">Gửi đánh giá</button>
      </div>
    </div>
  `;
}

function sessionRowHtml(s) {
  const reserved = s.is_reserved;
  const full = s.available_slots !== undefined && s.available_slots <= 0 && !reserved;
  const btn = reserved
    ? `<button class="btn btn-danger btn-sm" onclick="cancelReservation('${s.id}',this)">Hủy đăng ký</button>`
    : full
      ? '<span class="badge badge-gray">Hết chỗ</span>'
      : `<button class="btn btn-primary btn-sm" onclick="reserveSession('${s.id}',this)">Đăng ký</button>`;
  return `
    <div class="session-item">
      <div>
        <div class="session-date-label">${fmtDate(s.start_time)}</div>
        <div class="session-info">
          ${fmtTime(s.start_time)}${s.end_time ? ' – ' + fmtTime(s.end_time) : ''}
          ${s.location ? '· 📍 ' + esc(s.location) : ''}
          ${s.available_slots !== undefined ? `· ${s.available_slots} chỗ trống` : ''}
          ${s.trainer ? '· 👨‍🏫 ' + esc(s.trainer) : ''}
        </div>
      </div>
      <div class="flex gap-8 align-center">${btn}</div>
    </div>`;
}

function testimonialHtml(t) {
  const name = t.user_name || t.user_email || 'Anonymous';
  return `
    <div class="testimonial-item">
      <div class="testimonial-meta">
        <div class="flex align-center gap-8">
          <div class="avatar" style="width:28px;height:28px;font-size:12px">${name.charAt(0).toUpperCase()}</div>
          <span class="text-sm bold" style="color:var(--text-bright)">${esc(name)}</span>
        </div>
        <div class="stars" style="font-size:14px">${starsHtml(t.rating || 0)}</div>
      </div>
      ${t.content ? `<div class="text-sm" style="color:var(--text);line-height:1.6">${esc(t.content)}</div>` : ''}
    </div>`;
}

function selectStar(val) {
  State.selectedStar = val;
  document.querySelectorAll('#star-selector .star').forEach((el, i) => {
    el.classList.toggle('filled', i < val);
  });
}

async function submitTestimonial(courseId) {
  const rating = State.selectedStar;
  if (!rating) { toast('Vui lòng chọn số sao', 'error'); return; }
  const content = document.getElementById('testimonial-content').value.trim();
  try {
    await API.post(`/courses/${courseId}/testimonials`, { rating, content });
    toast('Đánh giá đã được gửi!', 'success');
    document.getElementById('testimonial-content').value = '';
    State.selectedStar = 0;
    document.querySelectorAll('#star-selector .star').forEach(el => el.classList.remove('filled'));
    // reload testimonials
    const list = await API.get(`/courses/${courseId}/testimonials`).catch(() => []);
    const el = document.getElementById('testimonials-list');
    if (el) el.innerHTML = list.length ? list.map(testimonialHtml).join('') : '<div class="text-dim text-sm">Chưa có đánh giá nào</div>';
  } catch (e) { toast(e.message, 'error'); }
}

async function completeCourse(courseId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    await API.post(`/courses/${courseId}/complete`);
    toast('Khóa học đã được đánh dấu hoàn thành! 🎉', 'success');
    openCourseDetail(courseId);
    loadCourses(); // refresh catalog
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '✓ Mark as Completed'; }
  }
}

async function reserveSession(sessionId, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    await API.post(`/sessions/${sessionId}/reserve`);
    toast('Đăng ký buổi học thành công!', 'success');
    btn.textContent = 'Hủy đăng ký';
    btn.className = 'btn btn-danger btn-sm';
    btn.onclick = () => cancelReservation(sessionId, btn);
    btn.disabled = false;
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Đăng ký';
  }
}

async function cancelReservation(sessionId, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    await API.delete(`/sessions/${sessionId}/reserve`);
    toast('Đã hủy đăng ký', 'info');
    btn.textContent = 'Đăng ký';
    btn.className = 'btn btn-primary btn-sm';
    btn.onclick = () => reserveSession(sessionId, btn);
    btn.disabled = false;
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Hủy đăng ký';
  }
}

// ═══════════════════════════════════════════════════════════
// PAGE: SESSIONS CALENDAR
// ═══════════════════════════════════════════════════════════
function renderSessions(container) {
  container.innerHTML = `
    <div class="month-nav">
      <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">← Trước</button>
      <div class="month-label" id="month-label"></div>
      <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">Sau →</button>
    </div>
    <div id="sessions-list">${spinner()}</div>
  `;
  updateMonthLabel();
  loadSessionsByMonth();
}

function updateMonthLabel() {
  const el = document.getElementById('month-label');
  if (!el) return;
  const [y, m] = State.currentMonth.split('-');
  el.textContent = new Date(+y, +m - 1, 1).toLocaleDateString('vi-VN', { month: 'long', year: 'numeric' });
}

async function changeMonth(delta) {
  const [y, m] = State.currentMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  State.currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  updateMonthLabel();
  await loadSessionsByMonth();
}

async function loadSessionsByMonth() {
  const cont = document.getElementById('sessions-list');
  if (!cont) return;
  cont.innerHTML = spinner();
  try {
    const sessions = await API.get(`/sessions?month=${State.currentMonth}`);
    if (!sessions?.length) {
      cont.innerHTML = emptyState('📅', 'Không có buổi học nào', 'Tháng này chưa có session nào được lên lịch');
      return;
    }
    // Group by date
    const groups = {};
    sessions.forEach(s => {
      const key = s.start_time ? s.start_time.slice(0, 10) : 'unknown';
      if (!groups[key]) groups[key] = [];
      groups[key].push(s);
    });
    cont.innerHTML = Object.keys(groups).sort().map(date => `
      <div class="date-group">
        <div class="date-heading">${fmtDate(date)}</div>
        <div class="flex flex-col gap-8">
          ${groups[date].map(s => `
            <div class="session-item">
              <div>
                <div class="session-date-label">${esc(s.course_title || s.title || s.course_id || '')}</div>
                <div class="session-info">
                  ${fmtTime(s.start_time)}${s.end_time ? ' – ' + fmtTime(s.end_time) : ''}
                  ${s.location ? '· 📍 ' + esc(s.location) : ''}
                  ${s.available_slots !== undefined ? `· ${s.available_slots} chỗ trống` : ''}
                  ${s.trainer ? '· 👨‍🏫 ' + esc(s.trainer) : ''}
                </div>
              </div>
              <div class="flex gap-8 align-center">
                ${formatBadge(s.format)}
                ${s.is_reserved
                  ? `<button class="btn btn-danger btn-sm" onclick="cancelReservation('${s.id}',this)">Hủy</button>`
                  : (s.available_slots !== undefined && s.available_slots <= 0
                    ? '<span class="badge badge-gray">Hết chỗ</span>'
                    : `<button class="btn btn-primary btn-sm" onclick="reserveSession('${s.id}',this)">Đăng ký</button>`)}
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('');
  } catch (e) {
    cont.innerHTML = emptyState('⚠️', 'Lỗi tải dữ liệu', e.message);
  }
}

async function renderProfile(container) {
  container.innerHTML = spinner();
  try {
    const me = await API.get('/me');
    State.user = me;
    updateUserUI();
    if (!me.is_onboarded) { renderOnboarding(container, me); return; }
    renderProfileFull(container, me);
  } catch (e) {
    container.innerHTML = emptyState('⚠️', e.message);
  }
}

                <div class="text-dim text-xs mt-4">${fmtDate(e.enrolled_at)}</div>

                ${e.is_completed ? '<span class="badge badge-green">✓ Completed</span>' : '<span class="badge badge-gray">In Progress</span>'}
                <button class="btn btn-ghost btn-sm" onclick="openCourseDetail('${esc(e.course_id)}');closeModal('course-modal')">Xem</button>
              </div>
            </div>`).join('')}</div></div>`}
    </div>

    <!-- Reservations panel -->
    <div id="tab-reservations" class="tab-panel">
      ${!reservations.length

        : `<div class="flex flex-col gap-8">${reservations.map(r => `
            <div class="session-item">
              <div>
                <div class="session-date-label">${esc(r.course_title || r.course_id || '')}</div>
                <div class="session-info">${fmtDate(r.start_time)}${r.start_time ? ' · ' + fmtTime(r.start_time) : ''}${r.location ? ' · 📍 ' + esc(r.location) : ''}</div>

      <div class="card">
        <div class="section-title">Chỉnh sửa sở thích học tập</div>
        <form id="prefs-form" class="flex flex-col gap-16">
          <div class="form-group">
            <label>Format học (chọn nhiều)</label>
            <div class="checkbox-group" id="pref-formats">
              ${['online','offline','hybrid','blended'].map(f => {
                const checked = (me.learning_formats || []).includes(f);
                return `<label class="checkbox-pill ${checked?'checked':''}">

    e.preventDefault();
    const formats = [...document.querySelectorAll('#pref-formats input:checked')].map(el => el.value);
    const hours   = +document.getElementById('pref-hours').value || undefined;
    const goals   = document.getElementById('pref-goals').value.split(',').map(s => s.trim()).filter(Boolean);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      await API.put('/me', { learning_formats: formats, weekly_hours: hours, learning_goals: goals });
      toast('Cập nhật thành công!', 'success');
      switchProfileTab('prefs', document.querySelector('.tab'));
    } catch (err) { toast(err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Lưu thay đổi'; }
  });
}

function switchProfileTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`tab-${id}`)?.classList.add('active');
}

function togglePill(input) {
  input.closest('.checkbox-pill').classList.toggle('checked', input.checked);
}

function renderOnboarding(container, me) {
  container.innerHTML = `
    <div class="onboarding-wrap">
      <div class="onboarding-title">🎯 Chào mừng đến Learning Hub!</div>
      <div class="onboarding-subtitle">Hãy hoàn thành thông tin để chúng tôi có thể gợi ý khóa học phù hợp với bạn.</div>
      <form id="onboarding-form" class="flex flex-col gap-16">
        <div class="form-group">
          <label>Cấp bậc (Rank) *</label>
          <select id="ob-rank" required>
            <option value="">Chọn cấp bậc</option>
            <option>Junior</option><option>Mid</option><option>Senior</option>
            <option>Lead</option><option>Manager</option><option>Director</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vai trò (Role) *</label>
          <select id="ob-role" required>
            <option value="">Chọn vai trò</option>
            <option>Engineer</option><option>Designer</option><option>Product Manager</option>
            <option>Data Analyst</option><option>Marketing</option><option>HR</option>
            <option>Finance</option><option>Operations</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Class / Archetype</label>
          <select id="ob-class">
            <option value="">Chọn archetype (tùy chọn)</option>
            <option>Builder</option><option>Explorer</option><option>Leader</option>
            <option>Specialist</option><option>Communicator</option>
          </select>
        </div>
        <div class="form-group">
          <label>Số giờ học mỗi tuần *</label>
          <input type="number" id="ob-hours" min="1" max="40" placeholder="Ví dụ: 5" required />
        </div>
        <button type="submit" class="btn btn-yellow w-full" style="justify-content:center;font-size:15px;padding:12px;">
          🚀 Bắt đầu hành trình học tập
        </button>
      </form>
    </div>`;

  document.getElementById('onboarding-form').addEventListener('submit', async e => {
    e.preventDefault();
    const payload = {
      rank:            document.getElementById('ob-rank').value,
      role:            document.getElementById('ob-role').value,
      class_archetype: document.getElementById('ob-class').value,
      weekly_hours:    +document.getElementById('ob-hours').value,
    };
    if (!payload.rank || !payload.role || !payload.weekly_hours) {
      toast('Vui lòng điền đầy đủ thông tin bắt buộc (*)', 'error'); return;
    }
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      await API.post('/me/onboarding', payload);
      State.user = { ...State.user, ...payload, is_onboarded: true };
      updateUserUI();
      toast('Hoàn tất onboarding! Chào mừng bạn 🎉', 'success');
      renderProfile(container);
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false; btn.textContent = '🚀 Bắt đầu hành trình học tập';
    }
  });
}

// PAGE: POLICIES

async function renderPolicies(container) {
  container.innerHTML = spinner();
  try {
    const policies = await API.get('/policies');
    if (!policies?.length) { container.innerHTML = emptyState('📋', 'Chưa có chính sách nào'); return; }
    // group by category
    const groups = {};
    policies.forEach(p => {
      const cat = p.category || 'General';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(p);
    });
    container.innerHTML = Object.keys(groups).map(cat => `
      <div class="mb-24">
        <div style="font-size:16px;font-weight:700;color:var(--yellow);margin-bottom:12px;display:flex;align-items:center;gap:8px">
          📋 ${esc(cat)}
        </div>
        ${groups[cat].map(p => `
          <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <div class="accordion-title">${esc(p.title || p.name || 'Policy')}</div>
              <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-body">
              <div class="policy-text">${esc(p.content || p.description || 'No content available.')}</div>
              ${p.effective_date ? `<div class="text-dim text-xs mt-8">Hiệu lực từ: ${fmtDate(p.effective_date)}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>`).join('');
  } catch (e) {
    container.innerHTML = emptyState('⚠️', 'Lỗi tải dữ liệu', e.message);
  }
}

function toggleAccordion(header) {
  const body  = header.nextElementSibling;
  const arrow = header.querySelector('.accordion-arrow');
  const open  = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

function renderLDRequest(container) {
  container.innerHTML = `
    <div id="ld-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1000px">
      <!-- Form -->
      <div>
        <div class="section-title">Gửi yêu cầu L&amp;D</div>
        <div class="card">
          <form id="ld-form" class="flex flex-col gap-16">
            <div class="form-group">
              <label>Mô tả yêu cầu *</label>
              <textarea id="ld-desc" placeholder="Mô tả nhu cầu học tập của bạn, khóa học mong muốn, lý do cần thiết…" style="min-height:100px" required></textarea>
            </div>
            <div class="form-group">
              <label>Kỹ năng cần học</label>
              <input type="text" id="ld-skills" placeholder="Python, Leadership, SQL… (phân cách bằng dấu phẩy)" />
            </div>
            <div class="form-group">
              <label>Format học ưa thích</label>
              <div class="checkbox-group" id="ld-formats">
                ${['online','offline','hybrid','blended'].map(f =>
                  `<label class="checkbox-pill"><input type="checkbox" value="${f}" onchange="togglePill(this)">${f}</label>`
                ).join('')}
              </div>
            </div>
            <div class="form-group">
              <label>Số giờ có thể học / tuần</label>
              <input type="number" id="ld-hours" min="1" max="40" placeholder="Ví dụ: 5" />
            </div>
            <div class="form-group">
              <label>Ghi chú thêm</label>
              <textarea id="ld-notes" placeholder="Thông tin bổ sung (ngân sách, timeline, ưu tiên…)"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="align-self:flex-start">📤 Gửi yêu cầu</button>
          </form>
        </div>
      </div>
      <!-- My requests -->
      <div>
        <div class="section-title">Yêu cầu của tôi</div>
        <div id="my-ld-requests">${spinner()}</div>
      </div>
    </div>
  `;
  loadMyLDRequests();

  document.getElementById('ld-form').addEventListener('submit', async e => {
    e.preventDefault();
    const desc = document.getElementById('ld-desc').value.trim();
    if (!desc) { toast('Vui lòng nhập mô tả yêu cầu', 'error'); return; }
    const skills  = document.getElementById('ld-skills').value.split(',').map(s => s.trim()).filter(Boolean);
    const formats = [...document.querySelectorAll('#ld-formats input:checked')].map(el => el.value);
    const hours   = +document.getElementById('ld-hours').value || undefined;
    const notes   = document.getElementById('ld-notes').value.trim();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Đang gửi…';
    try {
      await API.post('/ld-requests', {
        description: desc, skills_needed: skills,
        preferred_formats: formats, weekly_hours: hours, other_notes: notes,
      });
      toast('Yêu cầu đã được gửi thành công!', 'success');
      e.target.reset();
      document.querySelectorAll('#ld-formats .checkbox-pill').forEach(el => el.classList.remove('checked'));
      loadMyLDRequests();
    } catch (err) { toast(err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '📤 Gửi yêu cầu'; }
  });
}

async function loadMyLDRequests() {
  const cont = document.getElementById('my-ld-requests');
  if (!cont) return;
  cont.innerHTML = spinner();
  try {
    const reqs = await API.get('/ld-requests/mine');
    if (!reqs?.length) { cont.innerHTML = emptyState('✉️', 'Chưa có yêu cầu nào', 'Gửi yêu cầu đầu tiên của bạn!'); return; }
    const statusBadge = s => {
      const m = { pending:'badge-yellow', approved:'badge-green', rejected:'badge-red', in_progress:'badge-blue' };
      return `<span class="badge ${m[s] || 'badge-gray'}">${esc(s || 'pending')}</span>`;
    };
    cont.innerHTML = reqs.map(r => `
      <div class="ld-request-item">
        <div class="ld-request-desc">${esc(r.description)}</div>
        <div class="ld-request-meta">
          ${statusBadge(r.status)}
          <span class="text-dim text-xs">📅 ${fmtDate(r.created_at)}</span>
          ${(r.skills_needed || []).map(s => `<span class="badge badge-blue">${esc(s)}</span>`).join('')}
          ${(r.preferred_formats || []).map(f => formatBadge(f)).join('')}
        </div>
        ${r.other_notes ? `<div class="text-dim text-sm mt-8" style="font-style:italic">"${esc(r.other_notes)}"</div>` : ''}
        ${r.admin_reply ? `<div class="mt-8 card" style="background:var(--dark);padding:10px"><div class="text-dim text-xs mb-4">Phản hồi từ L&D Team:</div><div class="text-sm">${esc(r.admin_reply)}</div></div>` : ''}
      </div>`).join('');
  } catch (e) {
    cont.innerHTML = emptyState('⚠️', 'Lỗi tải dữ liệu', e.message);
  }
}
