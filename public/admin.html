<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Journey Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#E41E26;--primary-hover:#c01920;--accent:#FFBA00;
  --bg:#0d1117;--sidebar-bg:#0a0e15;--card-bg:#161b22;--card-border:#21262d;
  --input-bg:#0d1117;--text:#e6edf3;--text-muted:#8b949e;--text-dim:#6e7681;
  --success:#2ea043;--warning:#d29922;--danger:#da3633;--info:#1f6feb;
  --sidebar-width:220px;--header-h:56px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar-width);background:var(--sidebar-bg);border-right:1px solid var(--card-border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:var(--header-h);background:var(--card-bg);border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.login-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:40px;width:380px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo span{font-size:28px;font-weight:700;color:var(--primary)}
.login-logo small{display:block;color:var(--text-muted);font-size:13px;margin-top:4px}
.sidebar-logo{padding:20px 16px 12px;border-bottom:1px solid var(--card-border)}
.sidebar-logo-text{font-size:16px;font-weight:700;color:var(--primary)}
.sidebar-logo-sub{font-size:11px;color:var(--text-muted)}
.nav-section{padding:8px 8px 0}
.nav-section-label{font-size:10px;text-transform:uppercase;color:var(--text-dim);padding:8px 8px 4px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;color:var(--text-muted);transition:all .15s;font-size:13px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
.nav-item.active{background:rgba(228,30,38,.15);color:var(--primary)}
.nav-icon{width:16px;height:16px;flex-shrink:0}
.sidebar-bottom{margin-top:auto;padding:12px 8px;border-top:1px solid var(--card-border)}
.user-chip{display:flex;align-items:center;gap:8px;padding:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;color:var(--text-muted)}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600;flex:1}
.card-body{padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:20px}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--card-border)}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(33,38,45,.6);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr.clickable{cursor:pointer}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:rgba(46,160,67,.15);color:#3fb950}
.badge-red{background:rgba(218,54,51,.15);color:#f85149}
.badge-yellow{background:rgba(210,153,34,.15);color:var(--accent)}
.badge-blue{background:rgba(31,111,235,.15);color:#58a6ff}
.badge-gray{background:rgba(139,148,158,.15);color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--card-border)}
.btn-secondary:hover:not(:disabled){background:rgba(255,255,255,.06)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover:not(:disabled){background:#218838}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-danger:hover:not(:disabled){background:rgba(218,54,51,.1)}
.btn-accent{background:var(--accent);color:#000;border-color:var(--accent)}
.btn-accent:hover:not(:disabled){background:#e6a800}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 8px;font-size:11px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative}
.search-input{flex:1;min-width:200px;max-width:320px;background:var(--input-bg);border:1px solid var(--card-border);border-radius:6px;color:var(--text);padding:7px 12px 7px 34px;font-size:13px;outline:none}
.search-input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column}
.modal-lg{max-width:800px}
.modal-sm{max-width:440px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600;flex:1}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:4px;font-size:20px;line-height:1}
.modal-close:hover{color:var(--text);background:rgba(255,255,255,.08)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid var(--card-border);display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-shrink:0}
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:12px 16px;min-width:280px;max-width:400px;font-size:13px;display:flex;align-items:flex-start;gap:10px;pointer-events:all;animation:slideIn .2s ease;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.toast-success{border-left:3px solid var(--success)}
.toast.toast-error{border-left:3px solid var(--danger)}
.toast.toast-warning{border-left:3px solid var(--warning)}
.toast.toast-info{border-left:3px solid var(--info)}
.toast-msg{flex:1;color:var(--text);line-height:1.4}
.toast-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0;line-height:1;flex-shrink:0}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--card-border);margin-bottom:20px}
.tab-btn{padding:10px 16px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-state-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.section-title{font-size:18px;font-weight:700;flex:1}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:6px}
.form-control{width:100%;background:var(--input-bg);border:1px solid var(--card-border);border-radius:6px;color:var(--text);padding:8px 12px;font-size:13px;outline:none;transition:border-color .15s}
.form-control:focus{border-color:var(--primary)}
.form-control::placeholder{color:var(--text-dim)}
textarea.form-control{resize:vertical;min-height:80px;font-family:inherit}
select.form-control{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.form-check input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.detail-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-item label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.detail-item span{font-size:13px;color:var(--text)}
.confirm-box{text-align:center;padding:8px 0}
.confirm-box .confirm-icon{font-size:36px;margin-bottom:12px}
.confirm-box h3{font-size:16px;margin-bottom:8px}
.confirm-box p{color:var(--text-muted);font-size:13px;line-height:1.5}
.file-drop{border:2px dashed var(--card-border);border-radius:8px;padding:32px;text-align:center;cursor:pointer;transition:border-color .15s;display:block}
.file-drop:hover,.file-drop.drag-over{border-color:var(--primary);background:rgba(228,30,38,.04)}
.file-drop input{display:none}
.file-drop p{color:var(--text-muted);font-size:13px;margin-top:8px}
.pagination{display:flex;align-items:center;gap:6px;padding:14px 20px;border-top:1px solid var(--card-border)}
.pagination-info{flex:1;font-size:12px;color:var(--text-muted)}
.page-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--card-border);background:transparent;color:var(--text-muted);cursor:pointer;font-size:12px}
.page-btn:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--text)}
.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.divider{border:none;border-top:1px solid var(--card-border);margin:16px 0}
.text-muted{color:var(--text-muted)}
.text-danger{color:var(--danger)}
.text-success{color:#3fb950}
.text-accent{color:var(--accent)}
.fw-600{font-weight:600}
.mt-16{margin-top:16px}
.mb-16{margin-bottom:16px}
.flex{display:flex}
.items-center{align-items:center}
.gap-8{gap:8px}
.flex-1{flex:1}
.hidden{display:none!important}
.tag{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:11px;background:rgba(255,255,255,.06);color:var(--text-muted);margin:1px}
.validation-result{border-radius:6px;padding:12px;margin-top:12px;font-size:13px;line-height:1.5}
.validation-ok{background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.3);color:#3fb950}
.validation-err{background:rgba(218,54,51,.1);border:1px solid rgba(218,54,51,.3);color:#f85149}
.validation-err li{margin-left:18px;margin-top:4px}
</style>
</head>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────
let currentUser = null;
const PAGE_SIZE = 25;

// ── Token helpers ──────────────────────────────────────────────────
const getToken = () => localStorage.getItem('glh_token');
const setToken = t => localStorage.setItem('glh_token', t);
const clearToken = () => localStorage.removeItem('glh_token');

// ── API fetch wrapper ──────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  let res;
  try { res = await fetch(path, { ...opts, headers }); }
  catch (e) { throw new Error('Network error: ' + e.message); }
  if (res.status === 401) { doLogout(); return null; }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const d = await res.json(); msg = d.error || d.message || msg; } catch {}
    throw new Error(msg);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

// ── Auth ───────────────────────────────────────────────────────────
async function devLogin() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showLoginError('Enter your email'); return; }
  try {
    const data = await apiFetch('/auth/dev-login', { method: 'POST', body: JSON.stringify({ email }) });
    if (!data) return;
    setToken(data.token);
    currentUser = data.user;
    bootApp();
  } catch (e) { showLoginError(e.message); }
}

function googleLogin() { window.location.href = '/auth/google'; }

async function logout() {
  try { await apiFetch('/auth/logout', { method: 'POST' }); } catch {}
  doLogout();
}

function doLogout() {
  clearToken(); currentUser = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showLoginError(msg) { document.getElementById('login-error').textContent = msg; }

// ── Boot ───────────────────────────────────────────────────────────
function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  updateSidebarUser();
  navigate('dashboard');
}

function updateSidebarUser() {
  if (!currentUser) return;

    try { if (params.get('user')) currentUser = JSON.parse(decodeURIComponent(params.get('user'))); } catch {}

// ── Toast ──────────────────────────────────────────────────────────
function toast(msg, type = 'info', duration = 4000) {
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.innerHTML = '<span style="font-size:15px;flex-shrink:0">' + (icons[type]||'ℹ️') + '</span>'
    + '<span class="toast-msg">' + escHtml(msg) + '</span>'
    + '<button class="toast-close" onclick="this.parentElement.remove()">×</button>';
  tc.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, duration);
}

// ── Modal helpers ──────────────────────────────────────────────────
function openModal(html, cls = '') {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay'; ov.id = 'modal-overlay';
  ov.innerHTML = '<div class="modal ' + cls + '">' + html + '</div>';
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { const m = document.getElementById('modal-overlay'); if (m) m.remove(); }

function confirmDialog(title, msg, onConfirm) {
  openModal(
    '<div class="modal-header"><div class="modal-title">' + escHtml(title) + '</div>'
    + '<button class="modal-close" onclick="closeModal()">×</button></div>'
    + '<div class="modal-body"><div class="confirm-box">'
    + '<div class="confirm-icon">🗑️</div><h3>' + escHtml(title) + '</h3>'
    + '<p>' + escHtml(msg) + '</p></div></div>'
    + '<div class="modal-footer">'
    + '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'
    + '<button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger)" onclick="closeModal();__confirmCb()">Delete</button>'
    + '</div>', 'modal-sm');
  window.__confirmCb = onConfirm;
}

// ── Utilities ──────────────────────────────────────────────────────
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(v) { return v == null ? '—' : v; }
function fmtDate(s) { if (!s) return '—'; try { return new Date(s).toLocaleDateString(); } catch { return s; } }
function fmtDateTime(s) { if (!s) return '—'; try { return new Date(s).toLocaleString(); } catch { return s; } }

function badgeStatus(s) {
  const m = { active:'green', inactive:'gray', pending:'yellow', approved:'green',
    rejected:'red', confirmed:'green', cancelled:'red', scheduled:'blue', completed:'gray' };
  return '<span class="badge badge-' + (m[s]||'gray') + '">' + escHtml(s||'—') + '</span>';
}
function tagsHtml(arr) {
  if (!arr || !arr.length) return '<span class="text-muted">—</span>';
  return arr.map(t => '<span class="tag">' + escHtml(t) + '</span>').join('');
}
function parseTags(s) { return s ? s.split(',').map(t=>t.trim()).filter(Boolean) : []; }

// Safely JSON-serialize for HTML attribute embedding
function safeAttr(obj) { return escHtml(JSON.stringify(obj)); }

// Store objects keyed by id for modal retrieval (avoids inline JSON in attributes)
const _store = {};
let _storeKey = 0;
function storeObj(obj) { const k = 'k' + (++_storeKey); _store[k] = obj; return k; }
function getObj(k) { return _store[k]; }

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (!lines.length) return [];
  const parse = line => {
    const vals = []; let inQ = false, cur = '';
    for (const c of line) {
      if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += c;
    }
    vals.push(cur); return vals;
  };
  const headers = parse(lines[0]).map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const vals = parse(line);
    const row = {};
    headers.forEach((h,i) => row[h] = (vals[i]||'').trim());
    return row;
  }).filter(r => Object.values(r).some(v=>v));
}

function downloadBlob(filename, content, mime='text/csv') {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function rowsToCSV(rows) {
  if (!rows.length) return '';
  const h = Object.keys(rows[0]);
  return [h.join(','), ...rows.map(r => h.map(k => JSON.stringify(r[k]??'')).join(','))].join('\n');
}

function loadingTable(cols) {
  return '<table><thead><tr>' + cols.map(c=>'<th>'+escHtml(c)+'</th>').join('') + '</tr></thead>'
    + '<tbody><tr><td colspan="' + cols.length + '" style="text-align:center;padding:32px"><div class="spinner"></div></td></tr></tbody></table>';
}
function errorState(msg) {
  return '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p class="text-danger">' + escHtml(msg) + '</p></div>';
}

async function submitCourse(id, isEdit) {
  const form = document.getElementById('course-form');
  if (!form) return;
  const fd = new FormData(form);
  const body = {};
  for (const [k,v] of fd.entries()) body[k] = v;
  body.is_active = form.querySelector('[name="is_active"]').checked;
  body.skill_tags = parseTags(body.skill_tags);
  body.rank_targets = parseTags(body.rank_targets);
  body.role_targets = parseTags(body.role_targets);
  body.duration_hours = parseFloat(body.duration_hours)||0;
  body.xp_reward = parseInt(body.xp_reward)||0;
  body.min_participants = parseInt(body.min_participants)||0;
  const cid = isEdit ? id : body.course_id;
  try {
    if (isEdit) await apiFetch('/admin/api/courses/'+cid, { method:'PUT', body:JSON.stringify(body) });
    else await apiFetch('/admin/api/courses', { method:'POST', body:JSON.stringify(body) });
    toast(isEdit ? 'Course updated' : 'Course created', 'success');
    closeModal(); await loadCourses();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteCourse(id, title) {
  confirmDialog('Delete Course', 'Delete "'+title+'"? This cannot be undone.', async () => {

      await apiFetch('/admin/api/courses/'+id, { method:'DELETE' });
      toast('Course deleted', 'success'); await loadCourses();
    } catch(e) { toast(e.message, 'error'); }
  });
}

async function renderUsers() {

    +'<input class="search-input" placeholder="Search users…" oninput="_usersFilter=this.value;_usersPage=1;renderUsersTable()"></div>'
    +'<button class="btn btn-secondary btn-sm" onclick="loadUsers()">↻ Refresh</button></div>'

async function loadUsers() {
  const wrap = document.getElementById('users-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<div style="text-align:center;padding:32px"><div class="spinner"></div></div>';
  try {
    const d = await apiFetch('/admin/api/users');
    _users = Array.isArray(d) ? d : (d.users||d.data||[]);
    _usersPage = 1; renderUsersTable();
  } catch(e) { wrap.innerHTML = errorState(e.message); }
}

function renderUsersTable() {
  const wrap = document.getElementById('users-wrap');
  const pagDiv = document.getElementById('users-pag');
  if (!wrap) return;
  let rows = _users;
  if (_usersFilter) {
    const q = _usersFilter.toLowerCase();
    rows = rows.filter(u => (u.email||'').toLowerCase().includes(q)||(u.full_name||'').toLowerCase().includes(q));
  }
  const total = rows.length, totalPages = Math.ceil(total/PAGE_SIZE)||1;
  _usersPage = Math.min(_usersPage, totalPages);
  const start = (_usersPage-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);
  if (!pageRows.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No users found.</p></div>';
    if (pagDiv) pagDiv.innerHTML = ''; return;
  }
  wrap.innerHTML = '<table><thead><tr>'
    +'<th>Email</th><th>Name</th><th>Rank</th><th>Role</th><th>XP</th><th>Enrollments</th><th>Reservations</th><th>Onboarded</th>'
    +'</tr></thead><tbody>'
    + pageRows.map(u => {
      const uid = escHtml(u.id||u._id||u.user_id||'');
      return '<tr class="clickable" onclick="viewUser(\''+uid+'\')"><td>'+escHtml(u.email)+'</td>'
        +'<td>'+escHtml(u.full_name||'—')+'</td><td>'+escHtml(u.rank||'—')+'</td><td>'+escHtml(u.role||'—')+'</td>'
        +'<td class="text-accent fw-600">'+fmt(u.xp||0)+'</td>'
        +'<td>'+fmt(u.enrollments_count||0)+'</td><td>'+fmt(u.reservations_count||0)+'</td>'
        +'<td>'+(u.onboarded?'<span class="badge badge-green">Yes</span>':'<span class="badge badge-gray">No</span>')+'</td></tr>';
    }).join('')+'</tbody></table>';
  if (pagDiv) {
    if (totalPages<=1) { pagDiv.innerHTML=''; return; }
    let btns='';
    for (let i=1;i<=totalPages;i++) btns+='<button class="page-btn '+(i===_usersPage?'active':'')+'" onclick="_usersPage='+i+';renderUsersTable()">'+i+'</button>';
    pagDiv.innerHTML='<div class="pagination"><div class="pagination-info">Showing '+(start+1)+'–'+Math.min(start+PAGE_SIZE,total)+' of '+total+'</div>'+btns+'</div>';
  }
}

    +'</div>'
    +'<div class="modal-footer">'
    +'<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'
    +'<button class="btn btn-primary" id="pf-btn" disabled onclick="submitPolicyImport()">Import</button>'
    +'</div>');
  const drop = document.getElementById('pf-drop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handlePolicyFile({ files: e.dataTransfer.files }); });
  }
}

function handlePolicyFile(input) {
  const file = input.files[0]; if (!file) return;
  const info = document.getElementById('pf-info');
  if (info) info.textContent = 'Selected: '+file.name+' ('+(file.size/1024).toFixed(1)+' KB)';
  const reader = new FileReader();
  reader.onload = e => {
    _policyFileData = { fileBase64: e.target.result.split(',')[1], fileName: file.name };
    const btn = document.getElementById('pf-btn');
    if (btn) btn.disabled = false;
  };
  reader.readAsDataURL(file);
}

async function submitPolicyImport() {
  if (!_policyFileData) return;
  try {
    await apiFetch('/admin/api/policies/import', { method:'POST', body:JSON.stringify(_policyFileData) });
    toast('Policy imported','success'); closeModal(); await loadPolicies();
  } catch(e) { toast(e.message,'error'); }
}

// ══════════════════════════════════════════════════════════════════
//  DATA PREP
// ══════════════════════════════════════════════════════════════════
let _dpTab = 'courses', _dpRows = [];

async function renderDataPrep() {
  document.getElementById('content').innerHTML =
    '<div class="section-header"><div class="section-title">Data Prep</div></div>'
    +'<div class="tab-bar" id="dp-tabs">'
    +['courses','sessions','policies','admin-accounts'].map(t =>
      '<button class="tab-btn '+(_dpTab===t?'active':'')+'" onclick="switchDpTab(\''+t+'\')">'+t+'</button>'
    ).join('')
    +'</div>'
    +'<div id="dp-section"></div>';
  await renderDpSection();
}

async function switchDpTab(tab) {
  _dpTab = tab; _dpRows = [];
  document.querySelectorAll('#dp-tabs .tab-btn').forEach(b => b.classList.toggle('active', b.textContent.trim()===tab));
  await renderDpSection();
}

async function renderDpSection() {
  const container = document.getElementById('dp-section');
  if (!container) return;
  container.innerHTML =
    '<div class="card" style="margin-bottom:16px">'
    +'<div class="card-header"><div class="card-title">Upload CSV — '+escHtml(_dpTab)+'</div>'
    +'<div class="flex gap-8">'
    +'<button class="btn btn-secondary btn-sm" onclick="dpDownloadTemplate()">⬇ Template</button>'
    +'<button class="btn btn-secondary btn-sm" onclick="dpExport()">⬇ Export</button>'
    +'</div></div>'
    +'<div class="card-body">'
    +'<label class="file-drop" id="dp-drop" for="dp-file">'
    +'<div style="font-size:28px">📊</div>'
    +'<div class="fw-600" style="margin-top:6px">Drop CSV file here or click to browse</div>'
    +'<p>Only .csv files accepted</p>'
    +'<input type="file" id="dp-file" accept=".csv" onchange="handleDpFile(this)">'
    +'</label>'
    +'<div id="dp-file-info" style="margin-top:8px;font-size:12px;color:var(--text-muted)"></div>'
    +'</div></div>'
    +'<div class="card" id="dp-val-card" style="margin-bottom:16px;display:none">'
    +'<div class="card-header"><div class="card-title">Validation Results</div></div>'
    +'<div class="card-body" id="dp-val-body"></div></div>'
    +'<div class="card">'
    +'<div class="card-header"><div class="card-title">Staged Rows</div>'
    +'<div class="flex gap-8" id="dp-btns"></div></div>'
    +'<div class="table-wrap" id="dp-rows-wrap"><div style="text-align:center;padding:32px"><div class="spinner"></div></div></div>'
    +'</div>';
  const drop = document.getElementById('dp-drop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleDpFile({ files: e.dataTransfer.files }); });
  }
  await loadDpStaged();
}

async function loadDpStaged() {
  const wrap = document.getElementById('dp-rows-wrap');
  if (!wrap) return;
  try {
    const d = await apiFetch('/admin/api/data-prep/'+_dpTab);
    const rows = Array.isArray(d) ? d : (d.rows||d.data||[]);
    _dpRows = rows; renderDpTable(rows); renderDpBtns();
  } catch(e) {
    wrap.innerHTML = '<div class="empty-state"><p class="text-muted">No staged data — upload a CSV to begin.<br><small>'+escHtml(e.message)+'</small></p></div>';
    renderDpBtns();
  }
}

function handleDpFile(input) {
  const file = input.files[0]; if (!file) return;
  const info = document.getElementById('dp-file-info');
  if (info) info.textContent = 'Parsing '+file.name+'…';
  const reader = new FileReader();
  reader.onload = e => {
    _dpRows = parseCSV(e.target.result);
    if (info) info.textContent = 'Parsed '+_dpRows.length+' rows from '+file.name+'.';
    renderDpTable(_dpRows); renderDpBtns(); dpValidate();
  };
  reader.readAsText(file);
}

function renderDpTable(rows) {
  const wrap = document.getElementById('dp-rows-wrap');
  if (!wrap) return;
  if (!rows||!rows.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><p>No staged rows. Upload a CSV to begin.</p></div>';
    return;
  }
  const headers = Object.keys(rows[0]);
  wrap.innerHTML = '<table><thead><tr>'
    +headers.map(h=>'<th>'+escHtml(h)+'</th>').join('')
    +'</tr></thead><tbody>'
    +rows.slice(0,100).map(r=>'<tr>'+headers.map(h=>'<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+escHtml(r[h])+'">'+escHtml(r[h])+'</td>').join('')+'</tr>').join('')
    +'</tbody></table>'
    +(rows.length>100?'<div style="padding:10px 16px;font-size:12px;color:var(--text-muted)">Showing 100 of '+rows.length+' rows.</div>':'');
}

function renderDpBtns() {
  const div = document.getElementById('dp-btns');
  if (!div) return;
  if (!_dpRows.length) { div.innerHTML=''; return; }
  div.innerHTML =
    '<button class="btn btn-secondary btn-sm" onclick="dpValidate()">✓ Validate</button>'
    +'<button class="btn btn-primary btn-sm" onclick="dpSave()">💾 Save</button>'
    +'<button class="btn btn-accent btn-sm" onclick="dpPromote()">🚀 Promote</button>'
    +'<button class="btn btn-danger btn-sm" onclick="openDpRollback()">↩ Rollback</button>';
}

async function dpValidate() {
  if (!_dpRows.length) { toast('No rows to validate','warning'); return; }
  const vc = document.getElementById('dp-val-card');
  const vb = document.getElementById('dp-val-body');
  if (vc) vc.style.display='block';
  if (vb) vb.innerHTML='<div class="spinner"></div>';
  try {
    const res = await apiFetch('/admin/api/data-prep/'+_dpTab+'/validate', { method:'POST', body:JSON.stringify({rows:_dpRows}) });
    if (!vb) return;
    const ok = res.valid||res.success||!(res.errors?.length);
    if (ok) {
      vb.innerHTML = '<div class="validation-result validation-ok">✅ All '+_dpRows.length+' rows validated successfully'+(res.warnings?.length?' (with '+res.warnings.length+' warnings)':'')+'.</div>';
    } else {
      const errs = (res.errors||[]).slice(0,30);
      vb.innerHTML = '<div class="validation-result validation-err">❌ Validation failed with '+(res.errors?.length||0)+' error(s):<ul>'
        +errs.map(e=>'<li>'+escHtml(typeof e==='string'?e:JSON.stringify(e))+'</li>').join('')+'</ul></div>';
    }
  } catch(e) {
    const vb2 = document.getElementById('dp-val-body');
    if (vb2) vb2.innerHTML='<div class="validation-result validation-err">Error: '+escHtml(e.message)+'</div>';
  }
}

async function dpSave() {
  if (!_dpRows.length) { toast('No rows to save','warning'); return; }
  try {
    await apiFetch('/admin/api/data-prep/'+_dpTab+'/save', { method:'POST', body:JSON.stringify({rows:_dpRows}) });
    toast('Rows saved to staging','success');
  } catch(e) { toast(e.message,'error'); }
}

async function dpPromote() {
  if (!confirm('Promote staged data to live? This will overwrite current live data for '+_dpTab+'.')) return;
  try {
    await apiFetch('/admin/api/data-prep/'+_dpTab+'/promote', { method:'POST' });
    toast('Data promoted to live!','success');
  } catch(e) { toast(e.message,'error'); }
}

function openDpRollback() {
  openModal(
    '<div class="modal-header"><div class="modal-title">Rollback</div><button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div class="modal-body"><div class="form-group"><label class="form-label">Batch ID</label>'
    +'<input class="form-control" id="rb-batch" placeholder="Enter batch ID to rollback"></div></div>'
    +'<div class="modal-footer">'
    +'<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'
    +'<button class="btn btn-danger" onclick="dpRollback()">Rollback</button>'
    +'</div>','modal-sm');
}

async function dpRollback() {
  const batchId = (document.getElementById('rb-batch')||{}).value?.trim();
  if (!batchId) { toast('Enter a batch ID','warning'); return; }
  try {
    await apiFetch('/admin/api/data-prep/'+_dpTab+'/rollback', { method:'POST', body:JSON.stringify({batchId}) });
    toast('Rollback successful','success'); closeModal(); await loadDpStaged();
  } catch(e) { toast(e.message,'error'); }
}

async function dpDownloadTemplate() {
  try {
    const d = await apiFetch('/admin/api/data-prep/templates/'+_dpTab);
    if (typeof d==='string') downloadBlob(_dpTab+'_template.csv', d);
    else if (Array.isArray(d)) downloadBlob(_dpTab+'_template.csv', rowsToCSV(d));
    else toast('Template downloaded','success');
  } catch(e) { toast(e.message,'error'); }
}

async function dpExport() {
  try {
    const d = await apiFetch('/admin/api/data-prep/'+_dpTab+'/export');
    if (typeof d==='string') downloadBlob(_dpTab+'_export.csv', d);
    else if (Array.isArray(d)) downloadBlob(_dpTab+'_export.csv', rowsToCSV(d));
    else toast('Export complete','success');
  } catch(e) { toast(e.message,'error'); }
}

// ══════════════════════════════════════════════════════════════════
//  ADMIN ACCOUNTS
// ══════════════════════════════════════════════════════════════════
let _accounts = [];

async function renderAccounts() {
  if (currentUser?.role !== 'super_admin') {
    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔒</div><p>Super admin access required.</p></div>';
    return;
  }
  document.getElementById('content').innerHTML =
    '<div class="section-header"><div class="section-title">Admin Accounts</div>'
    +'<button class="btn btn-primary" onclick="openAccountModal(null)">+ New Account</button></div>'
    +'<div class="card">'
    +'<div class="card-header"><div class="card-title">All Admin Accounts</div>'
    +'<button class="btn btn-secondary btn-sm" onclick="loadAccounts()">↻ Refresh</button></div>'
    +'<div class="table-wrap" id="accounts-wrap"><div style="text-align:center;padding:32px"><div class="spinner"></div></div></div></div>';
  await loadAccounts();
}

async function loadAccounts() {
  const wrap = document.getElementById('accounts-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<div style="text-align:center;padding:32px"><div class="spinner"></div></div>';
  try {
    const d = await apiFetch('/admin/api/accounts');
    _accounts = Array.isArray(d) ? d : (d.accounts||d.data||[]);
    renderAccountsTable();
  } catch(e) { wrap.innerHTML = errorState(e.message); }
}

function renderAccountsTable() {
  const wrap = document.getElementById('accounts-wrap');
  if (!wrap) return;
  if (!_accounts.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👤</div><p>No accounts found.</p></div>';
    return;
  }
  wrap.innerHTML = '<table><thead><tr>'
    +'<th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th>'
    +'</tr></thead><tbody>'
    + _accounts.map(a => {
      const k = storeObj(a);
      return '<tr>'
        +'<td>'+escHtml(a.email)+'</td>'
        +'<td>'+escHtml(a.full_name||'—')+'</td>'
        +'<td><span class="badge badge-blue">'+escHtml(a.role||'—')+'</span></td>'
        +'<td>'+badgeStatus(a.is_active!==false?'active':'inactive')+'</td>'
        +'<td>'+fmtDate(a.created_at)+'</td>'
        +'<td><button class="btn btn-secondary btn-xs" onclick="openAccountModal(\''+k+'\')">Edit</button></td>'
        +'</tr>';
    }).join('')+'</tbody></table>';
}

function openAccountModal(key) {
  const a = key ? getObj(key) : null;
  const isEdit = !!a;
  const roles = ['super_admin','admin','editor','ld_admin'];
  openModal(
    '<div class="modal-header"><div class="modal-title">'+(isEdit?'Edit Account':'New Admin Account')+'</div>'
    +'<button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div class="modal-body"><form id="account-form">'
    +'<div class="form-group"><label class="form-label">Email (@garena.vn) *</label>'
    +'<input class="form-control" name="email" type="email" value="'+escHtml(a?.email||'')+'" placeholder="name@garena.vn" '+(isEdit?'readonly':'')+' required></div>'
    +'<div class="form-group"><label class="form-label">Full Name *</label>'
    +'<input class="form-control" name="full_name" value="'+escHtml(a?.full_name||'')+'" required></div>'
    +'<div class="form-group"><label class="form-label">Role *</label>'
    +'<select class="form-control" name="role">'
    +roles.map(r=>'<option value="'+r+'"'+(a?.role===r?' selected':'')+'>'+r+'</option>').join('')
    +'</select></div>'
    +'<div class="form-group"><label class="form-check">'
    +'<input type="checkbox" name="is_active" '+(a?.is_active!==false?'checked':'')+'>Active</label></div>'
    +'</form></div>'
    +'<div class="modal-footer">'
    +'<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'
    +'<button class="btn btn-primary" onclick="submitAccount(\''+escHtml(a?.id||a?._id||'')+'\','+isEdit+')">'+(isEdit?'Save Changes':'Create Account')+'</button>'
    +'</div>');
}

async function submitAccount(id, isEdit) {
  const form = document.getElementById('account-form');
  if (!form) return;
  const fd = new FormData(form);
  const body = {};
  for (const [k,v] of fd.entries()) body[k] = v;
  body.is_active = form.querySelector('[name="is_active"]').checked;
  if (!isEdit && !body.email.endsWith('@garena.vn')) { toast('Email must be @garena.vn','warning'); return; }
  try {
    if (isEdit) await apiFetch('/admin/api/accounts/'+id, { method:'PUT', body:JSON.stringify({role:body.role,is_active:body.is_active}) });
    else await apiFetch('/admin/api/accounts', { method:'POST', body:JSON.stringify(body) });
    toast(isEdit?'Account updated':'Account created','success');
    closeModal(); await loadAccounts();
  } catch(e) { toast(e.message,'error'); }
}
</script>
